name: Create a draft release for a tag

# and we will create the following (which will persist until next run):
# - ./versions_upload/python #executable
# - psychopy #repo
# - devops #repo

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release or branch to regenerate notes for
        required: true
      dryrun:
        description: Just create the file, without touching releases
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  create_draft_release:

    runs-on: [
      ubuntu-latest
    ]

    env:
      # tag to make a release for (from manual input if given, otherwise the pushed tag)
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout psychopy
        uses: actions/checkout@v6
        with:
          repository: psychopy/psychopy
          path: psychopy
          fetch-depth: 0
      
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      
      - name: Install requirements
        run: |
          uv pip install requests
      
      - name: Work out filter from version
        id: filter
        run: |
          if [[ "$TAG" == "dev" || "$TAG" == *.0 ]]; then
            # for a major release (x.x.0) or dev branch, include PRs to all branches
            echo "args=" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == "release" || "$TAG" =~ \.[1-9][0-9]*$ ]]; then
            # for a bugfix release or release branch, only include PRs to the release branch
            echo "args=--filter release" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate draft release notes
        run: |
          uv run --no-project 'psychopy/building/releaseNotes.py' --token ${{ secrets.GITHUB_TOKEN }} ${{ steps.filter.outputs.args }}

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ env.TAG }}
          path: psychopy/building/.outputs/release_notes.md
          retention-days: 14

      - name: Check for existing release
        id: existing
        if: "!inputs.dryrun && env.TAG != 'dev' && env.TAG != 'release'"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh release view also finds draft releases
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        if: "!inputs.dryrun && env.TAG != 'dev' && env.TAG != 'release' && steps.existing.outputs.exists == 'false'"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: true
          body_path: psychopy/building/.outputs/release_notes.md
